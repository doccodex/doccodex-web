<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de Software Creativo</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#161a22;--mu:#566074;--ln:#dde2ea;--ac:#2f5bea;--fs:16px}
[data-theme=dark]{--bg:#12151b;--card:#1b1f27;--tx:#eef1f6;--mu:#a2abbb;--ln:#2d3340;--ac:#7b9bff}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Schibsted Grotesk",system-ui,sans-serif;line-height:1.55}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.w{max-width:1180px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--ln)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0}
.logo{font-weight:800;font-size:1.15rem}
.tools{display:flex;gap:8px;align-items:center}
.btn{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--ac)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
[data-theme=dark] .btn.p{color:#10131a}
h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.1;margin:36px 0 10px;font-weight:800;max-width:16ch}
.sub{color:var(--mu);max-width:60ch;margin:0 0 22px;font-size:1.05rem}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.bar{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;margin-bottom:14px}
.bar input,.bar select{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.tab{white-space:nowrap;background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:7px 14px;font-weight:500}
.tab[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.cnt{color:var(--mu);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;padding-bottom:90px}
.card{background:var(--card);border:1px solid var(--ln);border-left:6px solid var(--c);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:start}
.card h3{margin:0;font-size:1.3rem}
.cat{color:var(--c);font-weight:700;font-size:.85rem}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.8rem;font-weight:700;border-radius:6px;padding:2px 8px;border:1px solid var(--ln)}
.Gratis{background:#dcf7e4;color:#13663a}.Open{background:#d9ecff;color:#124d8f}.Pago{background:#ffe3df;color:#9a2a1b}.Freemium{background:#fff1c9;color:#7a5600}
.card h4{margin:6px 0 2px;font-size:.92rem}
.card p,.card li{margin:0;font-size:.97rem}
.card ul{margin:0;padding-left:20px}
.ft{margin-top:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:8px}
.fav[aria-pressed=true]{background:#ffd84d;color:#222;border-color:#ffd84d}
.ft label{font-size:.9rem;display:flex;gap:5px;align-items:center;margin-left:auto}
.ft a{font-weight:700;color:var(--ac)}
.cmp{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:none;gap:10px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;align-items:center;z-index:5}
.cmp.on{display:flex}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);max-width:min(960px,94vw);width:100%;padding:22px;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border:1px solid var(--ln);padding:10px;text-align:left;vertical-align:top;font-size:.95rem}
th{background:var(--bg)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:12px}
.res{border-left:5px solid var(--c);padding:6px 12px;margin:10px 0}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px}
@media(max-width:700px){.bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<header><div class="w top">
<div class="logo">Taller de Software Creativo</div>
<div class="tools">
<button class="btn" id="fm" aria-label="Reducir texto">A-</button>
<button class="btn" id="f0" aria-label="Texto normal">A</button>
<button class="btn" id="fp" aria-label="Aumentar texto">A+</button>
<button class="btn" id="th">🌙 Oscuro</button>
</div></div></header>
<main class="w">
<h1>Encuentra el programa justo para crear.</h1>
<p class="sub">Animación, fotografía, videojuegos, 3D, ilustración y audio. Compara, guarda tus favoritos y arma tu kit de herramientas.</p>
<div class="cta">
<button class="btn p" id="qz">Encuentra tu software en 3 preguntas</button>
<button class="btn" id="favf" aria-pressed="false">⭐ Mi kit (<span id="fc">0</span>)</button>
</div>
<div class="bar">
<input id="q" type="search" placeholder="Buscar por nombre o palabra clave…" aria-label="Buscar">
<select id="lic" aria-label="Licencia"><option value="">Toda licencia</option><option>Gratis</option><option>Open Source</option><option>Freemium</option><option>De pago</option></select>
<select id="lvl" aria-label="Nivel"><option value="">Todo nivel</option><option>Principiante</option><option>Intermedio</option><option>Profesional</option></select>
<button class="btn" id="rs">Limpiar</button>
</div>
<div class="tabs" id="tabs" role="group" aria-label="Categorías"></div>
<p class="cnt" id="cnt" aria-live="polite"></p>
<section class="grid" id="grid"></section>
</main>
<div class="cmp" id="cmp"><span id="cn"></span><button class="btn" id="cgo">Comparar</button><button class="btn" id="cx">Vaciar</button></div>
<dialog id="dlg"><button class="btn" style="float:right" onclick="dlg.close()">Cerrar ✕</button><div id="dc"></div></dialog>

<script>
const CATS={an:["🎬 Animación","#e0457b"],ph:["🖼️ Fotos y retoque","#2f8fe0"],gm:["🎮 Videojuegos","#7a4de0"],td:["🧊 Modelado y 3D","#e07a1f"],il:["🎨 Ilustración","#1fa37a"],au:["🎵 Audio y FX","#b8860b"]};
// nombre|cat|licencia|nivel|qué hace|ventaja;ventaja;ventaja|ideal|url
const D=`Blender|an|Open Source|Intermedio|Suite 3D completa: modelado, animación, render y edición de vídeo en un solo programa gratuito.|Todo en uno sin coste;Comunidad enorme y tutoriales;Motor de render potente|Cortometrajes 3D, animación de personajes, efectos visuales|https://www.blender.org
Spine 2D|an|De pago|Intermedio|Anima personajes 2D con huesos (rigging) a partir de tus ilustraciones, sin dibujar cada fotograma.|Animaciones ligeras;Exporta a Unity, Godot y más;Malla y deformación flexibles|Personajes 2D para videojuegos y apps|https://esotericsoftware.com
Moho Animation|an|De pago|Principiante|Programa de animación 2D con rigging de huesos y dibujo vectorial, pensado para ser fácil de aprender.|Rigging intuitivo;Dibujo y animación juntos;Física y cámaras integradas|Series web, animación de personajes, estudios pequeños|https://moho.lostmarble.com
Adobe Animate|an|De pago|Intermedio|Crea animación 2D e interactiva con línea de tiempo y herramientas vectoriales.|Línea de tiempo clásica;Integra Photoshop e Illustrator;Exporta a vídeo, web y HTML5|Dibujos animados, banners animados, contenido educativo|https://www.adobe.com/products/animate.html
OpenToonz|an|Open Source|Profesional|Software de animación 2D tradicional, usado por estudios como Ghibli, listo para producción.|Gratis y abierto;Escáner y dibujo a mano;Efectos y compositing|Animación tradicional, cine de animación independiente|https://opentoonz.github.io
Dragonframe|an|De pago|Profesional|Controla cámara, luces y motores para rodar animación stop motion con precisión.|Estándar en la industria;Control de cámara DSLR;Cronograma de exposición|Stop motion profesional, películas de plastilina o marionetas|https://www.dragonframe.com
Adobe Photoshop|ph|De pago|Intermedio|El editor de imágenes más extendido: retoque, composición, capas y herramientas con IA.|Herramientas muy completas;Relleno generativo con IA;Estándar de la industria|Retoque profesional, diseño gráfico, composición|https://www.adobe.com/products/photoshop.html
Affinity Photo|ph|Freemium|Intermedio|Editor de fotos potente y alternativo a Photoshop, con capas, máscaras y retoque avanzado.|Gran relación calidad-precio;Rápido y ligero;Sin suscripción obligatoria|Retoque fotográfico y pintura digital|https://www.affinity.studio
GIMP|ph|Open Source|Intermedio|Editor de imágenes libre con capas, filtros y retoque para quien no quiere pagar licencias.|Gratis para siempre;Extensible con plugins;Funciona en Windows, Mac y Linux|Edición básica y avanzada, estudiantes, uso personal|https://www.gimp.org
Capture One|ph|De pago|Profesional|Revela archivos RAW con un color excelente y permite trabajar con la cámara conectada.|Colores muy precisos;Disparo conectado (tethering);Capas y máscaras en RAW|Fotografía de estudio y moda, flujo profesional|https://www.captureone.com
Adobe Lightroom|ph|De pago|Principiante|Organiza, revela y retoca fotos de forma rápida con ajustes simples y sincronización en la nube.|Fácil de aprender;Presets y edición por lotes;Sincroniza móvil y escritorio|Fotógrafos aficionados, viajes, bodas, catálogo grande|https://www.adobe.com/products/photoshop-lightroom.html
Darktable|ph|Open Source|Intermedio|Revelador RAW gratuito con edición no destructiva y gestión de tu biblioteca de fotos.|Gratis y abierto;Edición no destructiva;Muchos módulos de color|Fotógrafos que quieren una alternativa libre a Lightroom|https://www.darktable.org
Unity|gm|Freemium|Intermedio|Motor de juegos 2D y 3D muy versátil, con enorme tienda de recursos y exportación multiplataforma.|Publica en móvil, PC y consolas;Gran Asset Store;Mucha documentación|Juegos móviles, indies, realidad virtual|https://unity.com
Unreal Engine|gm|Freemium|Profesional|Motor con gráficos de altísima calidad y programación visual mediante Blueprints.|Calidad visual puntera;Blueprints sin escribir código;Herramientas de cine incluidas|Juegos AAA, arquitectura, producción virtual|https://www.unrealengine.com
Godot|gm|Open Source|Principiante|Motor ligero y libre para juegos 2D y 3D, con un lenguaje sencillo parecido a Python.|Gratis sin regalías;Muy ligero;Excelente para 2D|Juegos indie, game jams, aprender programación|https://godotengine.org
Construct 3|gm|Freemium|Principiante|Crea juegos 2D desde el navegador con eventos visuales, sin necesidad de programar.|No requiere código;Funciona en el navegador;Publicación rápida|Prototipos, juegos web, docentes y principiantes|https://www.construct.net
GameMaker|gm|Freemium|Principiante|Motor especializado en juegos 2D con editor visual y lenguaje propio fácil de aprender.|Ideal para 2D;Editor de sprites y niveles;Exporta a varias plataformas|Plataformas, juegos retro, proyectos indie|https://gamemaker.io
RPG Maker|gm|De pago|Principiante|Herramienta para crear tu propio juego de rol clásico con mapas, batallas y eventos listos.|Todo preparado para RPG;Muchos recursos incluidos;Plugins de la comunidad|JRPG, aventuras narrativas, primer juego|https://www.rpgmakerofficial.com
ZBrush|td|De pago|Profesional|Esculpe modelos 3D con millones de polígonos como si trabajaras con arcilla digital.|Detalle extremo;Pinceles muy variados;Estándar para personajes|Personajes, criaturas, figuras para impresión 3D|https://www.maxon.net/zbrush
Substance Painter|td|De pago|Intermedio|Pinta texturas y materiales realistas directamente sobre modelos 3D.|Materiales inteligentes;Vista previa en tiempo real;Exporta a motores y renderizadores|Texturas para juegos y cine, props y personajes|https://www.adobe.com/products/substance3d-painter.html
Autodesk Maya|td|De pago|Profesional|Software 3D profesional de modelado, rigging y animación usado en cine y videojuegos.|Rigging avanzado;Pipeline de estudio;Herramientas de animación sólidas|Animación de cine, estudios de videojuegos|https://www.autodesk.com/products/maya
Krita|il|Open Source|Principiante|Programa de pintura digital libre, hecho por artistas, con muchos pinceles y animación básica.|Gratis y sin límites;Pinceles personalizables;Estabilizador de trazo|Ilustración, cómic, concept art|https://krita.org
Procreate|il|De pago|Principiante|App de dibujo para iPad con un lienzo muy fluido y pago único, sin suscripción.|Pago único;Muy intuitiva con Apple Pencil;Animación sencilla|Ilustradores, bocetos, arte en movilidad|https://procreate.com
Clip Studio Paint|il|De pago|Intermedio|Programa para dibujar cómics, manga y animación 2D con herramientas de viñetas y entintado.|Excelente para cómic y manga;Líneas muy naturales;Biblioteca de materiales|Mangaka, cómic web, ilustración lineal|https://www.clipstudio.net
Audacity|au|Open Source|Principiante|Editor de audio gratuito para grabar, cortar, limpiar ruido y exportar tus pistas.|Gratis y sencillo;Reducción de ruido;Muchos formatos|Podcasts, locuciones, limpieza de sonido|https://www.audacityteam.org
Reaper|au|De pago|Intermedio|Estación de trabajo de audio digital ligera y muy personalizable para música y diseño sonoro.|Licencia económica;Muy ligera;Personalizable con scripts|Música, efectos de sonido, sonido para juegos|https://www.reaper.fm`
.split("\n").map(l=>{const a=l.split("|");return{n:a[0],c:a[1],l:a[2],v:a[3],w:a[4],p:a[5].split(";"),u:a[6],h:a[7]}});
const $=id=>document.getElementById(id);
const S={cat:"",fav:false,cmp:[]};
let favs=[];try{favs=JSON.parse(localStorage.getItem("kit")||"[]")}catch(e){}
const saveFav=()=>{try{localStorage.setItem("kit",JSON.stringify(favs))}catch(e){}};
const cls=l=>l=="Open Source"?"Open":l=="De pago"?"Pago":l;
function tabs(){$("tabs").innerHTML=[["","Todas"],...Object.entries(CATS).map(([k,v])=>[k,v[0]])].map(([k,t])=>`<button class="tab" aria-pressed="${S.cat==k}" data-c="${k}">${t}</button>`).join("")}
function list(){const q=$("q").value.toLowerCase().trim();
return D.filter(d=>(!S.cat||d.c==S.cat)&&(!$("lic").value||d.l==$("lic").value)&&(!$("lvl").value||d.v==$("lvl").value)&&(!S.fav||favs.includes(d.n))&&(!q||(d.n+d.w+d.p.join()+d.h+CATS[d.c][0]).toLowerCase().includes(q)))}
function card(d){const c=CATS[d.c][1];return `<article class="card" style="--c:${c}"><div class="hd"><div><div class="cat">${CATS[d.c][0]}</div><h3>${d.n}</h3></div><button class="btn fav" data-f="${d.n}" aria-pressed="${favs.includes(d.n)}" aria-label="Favorito">⭐</button></div>
<div class="tags"><span class="tag ${cls(d.l)}">${d.l}</span><span class="tag">${d.v}</span></div>
<h4>¿Qué hace este programa?</h4><p>${d.w}</p>
<h4>Ventajas principales</h4><ul>${d.p.map(x=>`<li>${x}</li>`).join("")}</ul>
<h4>Casos de uso ideales</h4><p>${d.h}</p>
<div class="ft"><a href="${d.u}" target="_blank" rel="noopener">Web oficial ↗</a><label><input type="checkbox" data-m="${d.n}" ${S.cmp.includes(d.n)?"checked":""}> Comparar</label></div></article>`}
function render(){const r=list();$("grid").innerHTML=r.length?r.map(card).join(""):`<p class="empty">No hay resultados. Prueba con otra búsqueda o limpia los filtros.</p>`;
$("cnt").textContent=r.length+" programas";$("fc").textContent=favs.length;tabs();
$("cmp").classList.toggle("on",S.cmp.length>0);$("cn").textContent=S.cmp.length+"/3 seleccionados"}
document.addEventListener("click",e=>{const t=e.target;
if(t.dataset.c!==undefined){S.cat=t.dataset.c;render()}
if(t.dataset.f){const n=t.dataset.f;favs=favs.includes(n)?favs.filter(x=>x!=n):[...favs,n];saveFav();render()}});
document.addEventListener("change",e=>{const n=e.target.dataset.m;if(!n)return;
if(e.target.checked){if(S.cmp.length>=3){e.target.checked=false;alert("Puedes comparar hasta 3 programas.");return}S.cmp.push(n)}else S.cmp=S.cmp.filter(x=>x!=n);
$("cmp").classList.toggle("on",S.cmp.length>0);$("cn").textContent=S.cmp.length+"/3 seleccionados"});
["q","lic","lvl"].forEach(i=>$(i).addEventListener("input",render));
$("rs").onclick=()=>{$("q").value="";$("lic").value="";$("lvl").value="";S.cat="";S.fav=false;$("favf").setAttribute("aria-pressed","false");render()};
$("favf").onclick=()=>{S.fav=!S.fav;$("favf").setAttribute("aria-pressed",S.fav);render()};
$("cx").onclick=()=>{S.cmp=[];render()};
$("cgo").onclick=()=>{if(S.cmp.length<2){alert("Selecciona al menos 2 programas.");return}
const s=S.cmp.map(n=>D.find(d=>d.n==n));const row=(t,f)=>`<tr><th>${t}</th>${s.map(d=>`<td>${f(d)}</td>`).join("")}</tr>`;
$("dc").innerHTML=`<h2>Comparador</h2><div style="overflow-x:auto"><table><tr><th></th>${s.map(d=>`<th>${d.n}</th>`).join("")}</tr>${row("Categoría",d=>CATS[d.c][0])}${row("Licencia",d=>d.l)}${row("Nivel",d=>d.v)}${row("Qué hace",d=>d.w)}${row("Ventajas",d=>d.p.join("<br>• ").replace(/^/,"• "))}${row("Ideal para",d=>d.h)}${row("Web",d=>`<a href="${d.u}" target="_blank" rel="noopener">Visitar ↗</a>`)}</table></div>`;dlg.showModal()};
// Test
const Q=[["¿Qué quieres crear?",Object.entries(CATS).map(([k,v])=>[v[0],k])],["¿Cuál es tu presupuesto?",[["Cero euros","0"],["Algo, si merece la pena","1"],["Sin límite","2"]]],["¿Qué nivel tienes?",[["Principiante","Principiante"],["Intermedio","Intermedio"],["Profesional","Profesional"]]]];
let ans=[];
function ask(i){if(i==3)return done();$("dc").innerHTML=`<h2>${Q[i][0]}</h2><p class="cnt">Pregunta ${i+1} de 3</p>`+Q[i][1].map(([t,v])=>`<button class="btn opt" data-v="${v}">${t}</button>`).join("");
$("dc").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[i]=b.dataset.v;ask(i+1)})}
function done(){const lv=["Principiante","Intermedio","Profesional"];
const sc=D.filter(d=>d.c==ans[0]).map(d=>{let s=0;const f=d.l=="Gratis"||d.l=="Open Source";
if(ans[1]=="0")s+=f?3:d.l=="Freemium"?2:0;else if(ans[1]=="1")s+=d.l=="Freemium"?3:f?2:1;else s+=2;
s+=3-Math.abs(lv.indexOf(d.v)-lv.indexOf(ans[2]))*1.5;return[d,s]}).sort((a,b)=>b[1]-a[1]).slice(0,3);
$("dc").innerHTML=`<h2>Tus mejores opciones</h2>`+sc.map(([d])=>`<div class="res" style="--c:${CATS[d.c][1]}"><h3>${d.n} <span class="tag ${cls(d.l)}">${d.l}</span> <span class="tag">${d.v}</span></h3><p>${d.w}</p><p><a href="${d.u}" target="_blank" rel="noopener">Web oficial ↗</a></p></div>`).join("")+`<button class="btn" id="rt">Repetir test</button>`;
$("rt").onclick=()=>{ans=[];ask(0)}}
$("qz").onclick=()=>{ans=[];ask(0);dlg.showModal()};
// Tema y fuente
const dlg=$("dlg");let fs=16;
const setF=n=>{fs=Math.min(22,Math.max(13,n));document.documentElement.style.setProperty("--fs",fs+"px");try{localStorage.setItem("fs",fs)}catch(e){}};
$("fm").onclick=()=>setF(fs-2);$("fp").onclick=()=>setF(fs+2);$("f0").onclick=()=>setF(16);
$("th").onclick=()=>{const d=document.documentElement.dataset.theme=="dark"?"light":"dark";document.documentElement.dataset.theme=d;$("th").textContent=d=="dark"?"☀️ Claro":"🌙 Oscuro";try{localStorage.setItem("th",d)}catch(e){}};
try{const t=localStorage.getItem("th");if(t=="dark")$("th").click();const f=+localStorage.getItem("fs");if(f)setF(f)}catch(e){}
render();
</script>
</body>
</html>
